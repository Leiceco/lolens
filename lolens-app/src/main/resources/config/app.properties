app.name=LoLens
app.version=1.0.0
# 英雄联盟客户端 lockfile 路径（国际服默认路径；国服/自定义安装路径会自动从进程命令行探测，无需修改）
lcu.lockfile.path=C:/Riot Games/League of Legends/lockfile
# OP.GG MCP 地址
opgg.mcp.url=https://mcp-api.op.gg/mcp
# OP.GG MCP 查询区域（战绩查询用，如 kr / na / euw）
opgg.region=kr
# 叠加窗口透明度
overlay.opacity=0.92
# 技能/消息发送冷却（秒）
send.cooldown.seconds=5
# 对局数据轮询间隔（秒）
live.poll.interval.seconds=5
# 自动接受对局 ready-check 轮询间隔（秒）
autoaccept.poll.interval.seconds=1
# 自动接受对局：ReadyCheck 后延迟接受秒数（0=立即接受，推荐 1~3 配合取消防抖）
autoaccept.delay.seconds=0
# 自动点赞：结算阶段 ballot 轮询间隔（秒）
honor.poll.interval.seconds=3
# 自动点赞：仅点赞队友（true）或包含敌方（false）
honor.allies.only=true
# 自动点赞：荣誉类型（MVP / HEART / COOL）
honor.type=MVP
# 自动回复：会话新消息轮询间隔（秒）
autoreply.poll.interval.seconds=2
# 自动回复：规则列表（trigger=response，多个规则用 | 分隔；触发词为消息包含匹配）
autoreply.rules=在吗=在的，有什么可以帮到你？|1=我在|上路=收到，马上来
# 返回房间/重赛：gameflow-phase 轮询间隔（秒）
lobbyflow.poll.interval.seconds=2
# 返回房间/重赛：结算后自动 play-again 延迟（秒）
lobbyflow.playagain.delay.seconds=5
# 返回房间/重赛：Reconnect 后自动重连延迟（秒）
lobbyflow.reconnect.delay.seconds=10
# 在线状态自定义：availability（chat / mobile / away）
chatstatus.availability=chat
# 在线状态自定义：个性签名（statusMessage，留空则不修改签名）
chatstatus.statusMessage=
# 在线状态自定义：展示排位队列（留空则不修改段位显示）
chatstatus.ranked.queue=
# 在线状态自定义：展示段位（如 DIAMOND / GOLD）
chatstatus.ranked.tier=
# 在线状态自定义：展示段位分档（I / II / III / IV）
chatstatus.ranked.division=
# 重生倒计时死亡状态轮询间隔（秒）
respawn.poll.interval.seconds=1
# 战绩查询：每次查询返回的最近对局场数
matchhistory.query.count=20
# 自动选人/禁用：选人阶段轮询间隔（秒）
pickban.poll.interval.seconds=2
# 自动选人/禁用：预设自动选择英雄（Data Dragon championId，逗号分隔；留空=不自动选）
pickban.pick.championIds=99,117
# 自动选人/禁用：预设自动禁用英雄（Data Dragon championId，逗号分隔；留空=不禁用）
pickban.ban.championIds=777,238
